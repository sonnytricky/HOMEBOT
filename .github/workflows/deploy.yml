name: Dokumentation

on:
    push:
        branches:
            - main
        paths:
            - 'docs/**'
            - 'zensical.toml'
            - 'requirements.txt'

    workflow_dispatch:

# Notwendige Berechtigungen für GitHub Pages Deployment
permissions:
    contents: read
    pages: write
    id-token: write

# Parallele Deployments abfangen
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'

            - name: Create Python Virtual Environment & Install Dependencies
              run: |
                  set -eu

                  python3 -m venv .venv
                  . .venv/bin/activate

                  python -m pip install --upgrade pip

                  if [ -f requirements.txt ]; then
                    pip install -r requirements.txt
                  else
                    pip install zensical
                  fi

            - name: Verify Zensical Installation
              run: |
                  set -eu
                  . .venv/bin/activate
                  zensical --version

            - name: Build Site
              run: |
                  set -eu
                  . .venv/bin/activate
                  rm -rf site
                  zensical build

                  test -d site
                  test -f site/index.html

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: 'site'

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4