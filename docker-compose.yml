services:
    homebot:
        image: ghcr.io/sonnytricky/homebot:latest
        container_name: homebot
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - ./jobs:/app/dist/jobs
            - ./modules:/app/dist/modules
            - ./utils:/app/dist/utils
            - ./types:/app/dist/types
            - ./data:/app/data
        environment:
            - NODE_ENV=production
            - TZ=${TZ}
            - PUID=${PUID}
            - PGID=${PGID}
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
