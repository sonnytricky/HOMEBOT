services:
    homebot:
        image: ghcr.io/sonnytricky/homebot:latest
        container_name: homebot
        restart: unless-stopped
        user: "${PUID}:${PGID}"
        env_file:
            - .env
        volumes:
            - ./jobs:/app/src/jobs
            - ./modules:/app/src/modules
            - ./utils:/app/src/utils
            - ./data:/app/data
        environment:
            - NODE_ENV=production
            - TZ=${TZ}
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
